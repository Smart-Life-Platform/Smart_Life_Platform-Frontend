name: Frontend CI/CD

on:
  push:
    branches:
      - main
      - developer

  pull_request:
    branches:
      - main
      - developer

  workflow_dispatch:

jobs:
  test-and-build:
    name: Test and build
    runs-on: ubuntu-latest

    env:
      CI: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --watchAll=false

      - name: Build application
        run: npm run build

  deploy-main:
    name: Deploy main
    needs: test-and-build
    runs-on: ubuntu-latest

    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'

    steps:
      - name: Trigger Vercel Production Deploy
        run: |
          curl -X POST "$VERCEL_DEPLOY_HOOK_MAIN"
        env:
          VERCEL_DEPLOY_HOOK_MAIN: ${{ secrets.VERCEL_DEPLOY_HOOK_MAIN }}

  deploy-developer:
    name: Deploy developer
    needs: test-and-build
    runs-on: ubuntu-latest

    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/developer'

    steps:
      - name: Trigger Vercel Preview Deploy
        run: |
          curl -X POST "$VERCEL_DEPLOY_HOOK_DEVELOPER"
        env:
          VERCEL_DEPLOY_HOOK_DEVELOPER: ${{ secrets.VERCEL_DEPLOY_HOOK_DEVELOPER }}
