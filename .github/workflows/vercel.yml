name: Frontend CI/CD

on:
  push:
    branches:
      - developer
      - main
  pull_request:
    branches:
      - developer
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: 'true'
      # Public placeholders allow fork PRs to build without repository secrets.
      # Vercel performs its own build with real environment variables.
      REACT_APP_API_BASE_URL: https://api.example.com/api
      REACT_APP_SUPABASE_URL: https://example.supabase.co
      REACT_APP_SUPABASE_PUBLIC_KEY: ci-placeholder-public-key
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test -- --watchAll=false --runInBand
      - name: Build
        run: npm run build

  deploy:
    name: Trigger Vercel deployment
    needs: checks
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/developer')
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Trigger Vercel Deploy Hook
        env:
          MAIN_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK_MAIN }}
          DEVELOPER_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK_DEVELOPER }}
        run: |
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            VERCEL_DEPLOY_HOOK="$MAIN_DEPLOY_HOOK"
          else
            VERCEL_DEPLOY_HOOK="$DEVELOPER_DEPLOY_HOOK"
          fi
          if [ -z "$VERCEL_DEPLOY_HOOK" ]; then
            echo "::error::Configure the Vercel deploy hook secret for this branch. See docs/ci-cd.md."
            exit 1
          fi
          curl --fail --silent --show-error --output /dev/null \
            --connect-timeout 10 --max-time 60 \
            --request POST "$VERCEL_DEPLOY_HOOK"
